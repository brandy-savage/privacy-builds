[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stremio-private-runtime"
version = "0.1.0"
description = "Privacy-first local Stremio addon companion"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
stremio-private = "stremio_private.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
